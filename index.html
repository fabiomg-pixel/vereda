<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a1f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Vereda — Hábitos</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#13160f; --bg2:#1a1f16; --card:#222820; --card2:#2a3026;
    --line:#363d30; --moss:#7c9a5a; --moss-d:#5c7740; --terra:#c8714a;
    --terra-d:#a85636; --txt:#e8e6dc; --txt2:#a8ad9c; --txt3:#6f7563;
    --gold:#d4a843; --shadow:0 8px 30px rgba(0,0,0,.45);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--txt);font-family:'Hanken Grotesk',sans-serif;overscroll-behavior:none}
  body{
    min-height:100vh;
    background-image:radial-gradient(circle at 20% 0%,rgba(124,154,90,.07),transparent 45%),
                     radial-gradient(circle at 90% 100%,rgba(200,113,74,.06),transparent 40%);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:540px;margin:0 auto;padding:0 18px;padding-top:calc(env(safe-area-inset-top) + 8px)}

  /* HEADER */
  header{padding:22px 0 14px;display:flex;justify-content:space-between;align-items:flex-end}
  .brand{font-family:'Fraunces',serif;font-size:30px;font-weight:600;letter-spacing:-.5px;line-height:1}
  .brand .dot{color:var(--moss)}
  .date{font-size:13px;color:var(--txt2);margin-top:5px;text-transform:capitalize}
  .streak-badge{background:linear-gradient(135deg,var(--terra),var(--terra-d));padding:8px 13px;border-radius:14px;
    display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;box-shadow:var(--shadow)}
  .streak-badge small{font-size:10px;font-weight:600;opacity:.85;display:block;line-height:1}

  /* PROGRESS RING SUMMARY */
  .summary{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:18px;
    display:flex;align-items:center;gap:18px;box-shadow:var(--shadow)}
  .ring{position:relative;width:78px;height:78px;flex-shrink:0}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .pct b{font-family:'Fraunces',serif;font-size:22px;font-weight:600}
  .ring .pct span{font-size:9px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px}
  .summary-txt h2{font-family:'Fraunces',serif;font-weight:500;font-size:18px;margin-bottom:3px}
  .summary-txt p{font-size:13px;color:var(--txt2);line-height:1.45}

  /* TABS */
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt2);padding:9px;border-radius:13px;
    font-family:'Hanken Grotesk';font-weight:600;font-size:13px;cursor:pointer;transition:.2s}
  .tab.active{background:var(--moss-d);border-color:var(--moss);color:#fff}

  /* HABIT CARD */
  .habits{display:flex;flex-direction:column;gap:11px}
  .habit{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;
    display:flex;align-items:flex-start;gap:14px;position:relative;overflow:hidden;transition:.25s}
  .habit.done{background:var(--card2);border-color:var(--moss-d)}
  .habit.skipped{opacity:.6}
  .habit.skipped.done{opacity:.6}
  .habit .accent{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--moss))}
  .check{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--c,var(--moss));flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:.25s;background:transparent;margin-top:2px}
  .habit.done .check{background:var(--c,var(--moss));border-color:var(--c,var(--moss))}
  .habit.skipped:not(.done) .check{border-style:dashed;border-color:var(--txt3)}
  .check svg{opacity:0;transform:scale(.5);transition:.25s}
  .habit.done .check svg{opacity:1;transform:scale(1)}
  .check-plus{font-size:22px;color:var(--c,var(--moss));font-weight:300;line-height:1}
  .habit.done .check-plus,.habit.skipped .check-plus{display:none}
  .h-info{flex:1;min-width:0;cursor:pointer}
  .h-info .icon-name{display:flex;align-items:center;gap:8px}
  .h-emoji{font-size:18px}
  .h-name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .habit.done .h-name{text-decoration:line-through;color:var(--txt2)}
  .h-meta{font-size:12px;color:var(--txt3);margin-top:3px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .h-streak{color:var(--terra);font-weight:600}
  .h-skip{color:var(--gold);font-weight:600}
  .h-chev{color:var(--txt3);background:none;border:none;font-size:22px;cursor:pointer;padding:6px 10px;flex-shrink:0;line-height:1;margin-top:2px}

  /* MEDIA on habit row */
  .h-media{display:flex;align-items:center;gap:9px;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.06)}
  .h-media-cover{width:30px;height:44px;object-fit:cover;border-radius:3px;background:var(--card2);flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .h-media-cover.empty{display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--txt3)}
  .h-media-info{flex:1;min-width:0}
  .h-media-title{font-size:12px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
  .h-media-author{font-size:11px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
  .h-media-empty{font-size:12px;color:var(--txt3);font-style:italic;margin-top:6px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.06)}

  .empty{text-align:center;padding:50px 20px;color:var(--txt3)}
  .empty .em{font-size:42px;margin-bottom:12px;opacity:.5}
  .empty p{font-size:14px;line-height:1.6}

  /* FAB */
  .fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));right:50%;transform:translateX(min(252px,46vw));
    width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--moss),var(--moss-d));
    border:none;color:#fff;font-size:30px;cursor:pointer;box-shadow:0 8px 24px rgba(124,154,90,.5);
    display:flex;align-items:center;justify-content:center;z-index:50}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;
    display:none;align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  .sheet{background:var(--bg2);border:1px solid var(--line);border-radius:26px 26px 0 0;width:100%;max-width:540px;
    padding:24px 20px calc(28px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow-y:auto}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet h3{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin-bottom:18px}
  .sheet h3.action-title{font-size:18px;color:var(--txt2);font-weight:500;margin-bottom:14px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;color:var(--txt2);font-weight:600;margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px}
  .field input[type=text],.field input[type=time],.field input[type=email],.field input[type=password]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:13px 15px;color:var(--txt);font-family:'Hanken Grotesk';font-size:16px}
  .field input[type=time]{color-scheme:dark}
  .field input:focus{outline:none;border-color:var(--moss)}
  .emoji-row,.color-row,.freq-row,.dow-row,.type-row{display:flex;gap:8px;flex-wrap:wrap}
  .emoji-pick{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .emoji-pick.sel{border-color:var(--moss);background:var(--card2)}
  .color-dot{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent}
  .color-dot.sel{border-color:var(--txt)}
  .freq-pick,.type-pick{flex:1;min-width:60px;background:var(--card);border:1px solid var(--line);color:var(--txt2);
    padding:11px;border-radius:12px;font-weight:600;font-size:13px;cursor:pointer;text-align:center}
  .freq-pick.sel,.type-pick.sel{background:var(--moss-d);border-color:var(--moss);color:#fff}
  .dow-row{display:flex;gap:5px;margin-top:8px}
  .dow-pick{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt2);
    padding:10px 0;border-radius:10px;font-weight:600;font-size:12px;cursor:pointer;text-align:center}
  .dow-pick.sel{background:var(--moss-d);border-color:var(--moss);color:#fff}
  .save-btn{width:100%;background:linear-gradient(135deg,var(--terra),var(--terra-d));border:none;color:#fff;
    padding:15px;border-radius:14px;font-family:'Hanken Grotesk';font-weight:700;font-size:16px;cursor:pointer;margin-top:6px}
  .cancel-btn{width:100%;background:none;border:none;color:var(--txt3);padding:12px;font-weight:600;cursor:pointer;margin-top:4px}

  /* ACTION SHEET */
  .action-menu{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
  .action-btn{background:var(--card);border:1px solid var(--line);color:var(--txt);
    padding:15px 16px;border-radius:13px;font-family:'Hanken Grotesk';font-weight:600;
    font-size:15px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px}
  .action-btn .ic{font-size:18px;width:22px;text-align:center;flex-shrink:0}
  .action-btn.danger{color:#e08070}
  .action-btn.primary{background:var(--moss-d);border-color:var(--moss);color:#fff}

  /* SEARCH MODAL */
  .search-status{font-size:13px;color:var(--txt3);text-align:center;padding:10px 0;min-height:20px}
  .search-results{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto;margin-bottom:8px;margin-top:4px}
  .search-result{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;align-items:center;transition:.15s}
  .search-result:active{background:var(--card2);transform:scale(.99)}
  .search-cover{width:42px;height:60px;object-fit:cover;border-radius:3px;background:var(--card2);flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .search-cover-empty{width:42px;height:60px;background:var(--card2);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;color:var(--txt3)}
  .search-info{flex:1;min-width:0}
  .search-title{font-size:14px;font-weight:600;color:var(--txt);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
  .search-author{font-size:12px;color:var(--txt2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .search-spin{display:inline-block;width:14px;height:14px;border:2px solid var(--txt3);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* STATS VIEW */
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:18px}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
  .stat-card b{font-family:'Fraunces',serif;font-size:28px;font-weight:600;display:block}
  .stat-card span{font-size:12px;color:var(--txt2)}
  .stat-card.accent b{color:var(--terra)}
  .stat-card.moss b{color:var(--moss)}
  .heatmap-card,.dow-card,.lib-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:18px}
  .heatmap-card h4,.dow-card h4,.lib-card h4{font-family:'Fraunces',serif;font-weight:500;font-size:16px;margin-bottom:14px}
  .heat{display:flex;gap:3px;flex-wrap:wrap}
  .heat-cell{width:13px;height:13px;border-radius:3px;background:var(--card2)}
  .heat-legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:10px;font-size:11px;color:var(--txt3)}
  .heat-legend .heat-cell{width:11px;height:11px}
  .per-habit{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
  .per-habit h4{font-family:'Fraunces',serif;font-weight:500;font-size:16px;margin-bottom:14px}
  .ph-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .ph-row:last-child{margin-bottom:0}
  .ph-name{font-size:14px;width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
  .ph-bar{flex:1;height:9px;background:var(--card2);border-radius:5px;overflow:hidden}
  .ph-fill{height:100%;border-radius:5px;transition:width .6s}
  .ph-pct{font-size:13px;font-weight:600;width:38px;text-align:right;color:var(--txt2)}

  /* DOW CHART */
  .dow-chart{display:flex;gap:7px;align-items:flex-end;height:100px;margin-bottom:6px}
  .dow-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
  .dow-bar-v{flex:1;width:100%;background:var(--card2);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden;min-height:14px}
  .dow-bar-fill{width:100%;border-radius:6px;transition:height .6s}
  .dow-pct-v{font-size:10px;color:var(--txt3);font-weight:600;line-height:1}
  .dow-label{font-size:11px;color:var(--txt2);font-weight:600;line-height:1}
  .dow-col.best .dow-label{color:var(--moss)}
  .dow-col.worst .dow-label{color:var(--terra)}
  .dow-caption{font-size:12px;color:var(--txt3);margin-top:8px;line-height:1.5}

  /* GAMIFICATION */
  .level-card{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--card),var(--card2));
    border:1px solid var(--moss-d);border-radius:18px;padding:16px;margin-bottom:18px;box-shadow:var(--shadow)}
  .level-emoji{font-size:42px;line-height:1;flex-shrink:0}
  .level-info{flex:1;min-width:0}
  .level-name{font-family:'Fraunces',serif;font-weight:600;font-size:19px}
  .level-xp{font-size:12px;color:var(--txt2);margin:3px 0 9px}
  .level-bar{height:9px;background:var(--bg2);border-radius:5px;overflow:hidden}
  .level-fill{height:100%;background:linear-gradient(90deg,var(--moss),var(--gold));border-radius:5px;transition:width .6s}
  .ach-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:18px}
  .ach-card h4{font-family:'Fraunces',serif;font-weight:500;font-size:16px;margin-bottom:14px}
  .ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .ach{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;opacity:.4;filter:grayscale(1);transition:.25s}
  .ach.on{opacity:1;filter:none;border-color:var(--moss-d);background:var(--card2)}
  .ach-em{font-size:26px;line-height:1}
  .ach-nm{font-size:12px;font-weight:700;margin-top:6px;line-height:1.2}
  .ach-ds{font-size:10px;color:var(--txt3);margin-top:2px;line-height:1.3}
  .ach-pg{font-size:10px;color:var(--moss);font-weight:700;margin-top:4px}

  /* LIBRARY (finished) */
  .lib-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
  .lib-item{display:flex;flex-direction:column;gap:5px;cursor:pointer}
  .lib-item img,.lib-cover-empty{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:5px;background:var(--card2);box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .lib-cover-empty{display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--txt3)}
  .lib-title{font-size:11px;font-weight:600;color:var(--txt2);text-align:center;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .lib-count{font-size:12px;color:var(--txt3);margin-top:10px;text-align:center}

  /* DETAIL of finished item */
  .detail-cover{width:120px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;background:var(--card2);box-shadow:0 4px 16px rgba(0,0,0,.5);margin:0 auto 18px;display:block}
  .detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .detail-row:last-of-type{border-bottom:none}
  .detail-row .lbl{color:var(--txt3)}
  .detail-row .val{color:var(--txt);font-weight:600;text-align:right}

  /* HEADER RIGHT + SYNC */
  .header-right{display:flex;align-items:center;gap:10px}
  .gear{position:relative;background:var(--card);border:1px solid var(--line);color:var(--txt2);
    width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .sync-dot{position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);background:var(--txt3)}
  .sync-dot.off{background:var(--txt3)}
  .sync-dot.ok{background:var(--moss)}
  .sync-dot.busy{background:var(--gold);animation:pulse 1s infinite}
  .sync-dot.err{background:var(--terra)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .sync-status-line{font-size:14px;color:var(--txt);display:flex;align-items:center;gap:8px;margin:2px 0 12px}
  .sync-status-line .sync-dot{position:static;border:none;width:10px;height:10px;flex-shrink:0}
  .help{font-size:13px;color:var(--txt2);line-height:1.55;margin-bottom:14px}
  .help.steps{padding-left:18px;margin-top:-4px}
  .help.steps li{margin-bottom:6px}
  .sep{border:none;border-top:1px solid var(--line);margin:16px 0}
  .sync-spin{display:inline-block;width:13px;height:13px;border:2px solid var(--txt3);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(96px + env(safe-area-inset-bottom));
    background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:12px 18px;border-radius:14px;font-size:14px;
    font-weight:600;box-shadow:var(--shadow);z-index:200;opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .auth-or{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--txt3);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">Vereda<span class="dot">.</span></div>
      <div class="date" id="today"></div>
    </div>
    <div class="header-right">
      <button class="gear" id="settingsBtn" aria-label="Configurações">⚙<span class="sync-dot off" id="syncDot"></span></button>
      <div class="streak-badge">🔥 <span id="globalStreak">0</span><small>SEQUÊNCIA</small></div>
    </div>
  </header>

  <div class="summary">
    <div class="ring">
      <svg width="78" height="78">
        <circle cx="39" cy="39" r="33" fill="none" stroke="#2a3026" stroke-width="7"/>
        <circle id="ringFill" cx="39" cy="39" r="33" fill="none" stroke="#7c9a5a" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="207.3" stroke-dashoffset="207.3"/>
      </svg>
      <div class="pct"><b id="pctNum">0%</b><span>hoje</span></div>
    </div>
    <div class="summary-txt">
      <h2 id="summaryTitle">Comece o dia</h2>
      <p id="summarySub">Construa hábitos, um dia de cada vez.</p>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="today">Hoje</button>
    <button class="tab" data-view="all">Todos</button>
    <button class="tab" data-view="stats">Progresso</button>
  </div>

  <div id="content"></div>
</div>

<button class="fab" id="addFab">+</button>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="overlay">

<script src="vendor-supabase.js"></script>
<script>
const EMOJIS=['💧','🏃','📖','🧘','💪','🥗','😴','✍️','🌱','☀️','🦷','💊','🎯','🧠','🎸','🚭'];
const COLORS=['#7c9a5a','#c8714a','#d4a843','#5b8a8a','#9a6a8a','#6a7a9a','#b85c5c','#7a9a6a'];
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const PRESET_DAYS={daily:[0,1,2,3,4,5,6],weekdays:[1,2,3,4,5],'3x':[1,3,5],weekend:[0,6]};

let state=JSON.parse(localStorage.getItem('vereda_v1')||'null')||{habits:[],log:{},skipped:{},current:{},finished:[],tombstones:{},updatedAt:0};
if(!state.skipped)state.skipped={};
if(!state.current)state.current={};
if(!state.finished)state.finished=[];
if(!state.tombstones)state.tombstones={};
state.habits.forEach(h=>{
  if(!h.days)h.days=(PRESET_DAYS[h.freq]||[0,1,2,3,4,5,6]).slice();
  if(!h.type)h.type='simple';
  if(h.updatedAt==null)h.updatedAt=0;
});
function persist(){state.updatedAt=Date.now();localStorage.setItem('vereda_v1',JSON.stringify(state))}
function save(){persist();scheduleSync()}
persist();

const esc=s=>String(s==null?'':s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayKey=()=>ymd(new Date());

function isScheduled(h,date){return h.days?h.days.includes(date.getDay()):true}
function isDone(id,key){return !!(state.log[key]&&state.log[key].includes(id))}
function isSkipped(id,key){return !!(state.skipped[key]&&state.skipped[key].includes(id))}

function toggle(id){
  const k=todayKey();
  if(!state.log[k])state.log[k]=[];
  if(isSkipped(id,k))state.skipped[k]=state.skipped[k].filter(x=>x!==id);
  const i=state.log[k].indexOf(id);
  if(i>=0)state.log[k].splice(i,1);else state.log[k].push(id);
  save();render();
  if(navigator.vibrate)navigator.vibrate(i>=0?10:[15,40,15]);
}
function toggleSkip(id){
  const k=todayKey();
  if(!state.skipped[k])state.skipped[k]=[];
  const i=state.skipped[k].indexOf(id);
  if(i>=0){state.skipped[k].splice(i,1);}
  else{state.skipped[k].push(id);if(state.log[k])state.log[k]=state.log[k].filter(x=>x!==id)}
  save();render();
  if(navigator.vibrate)navigator.vibrate(10);
}
// Tap on check: media w/o current → open search; else toggle
function tapCheck(id){
  const h=state.habits.find(x=>x.id===id);
  if(h&&h.type==='media'&&!state.current[id]&&!isDone(id,todayKey())){
    openSearch(id);return;
  }
  toggle(id);
}

function habitStreak(h){
  let s=0;const d=new Date();
  for(let i=0;i<400;i++){
    const k=ymd(d);
    if(isScheduled(h,d)){
      if(isSkipped(h.id,k)){}
      else if(isDone(h.id,k))s++;
      else if(k!==todayKey())break;
    }
    d.setDate(d.getDate()-1);
  }
  return s;
}
function globalStreak(){
  let s=0;const d=new Date();
  for(let i=0;i<400;i++){
    const k=ymd(d);
    const sched=state.habits.filter(h=>isScheduled(h,d));
    if(sched.length===0){d.setDate(d.getDate()-1);continue}
    const active=sched.filter(h=>!isSkipped(h.id,k));
    if(active.length===0){d.setDate(d.getDate()-1);continue}
    const allDone=active.every(h=>isDone(h.id,k));
    if(allDone)s++;
    else if(k!==todayKey())break;
    d.setDate(d.getDate()-1);
  }
  return s;
}

function formatDays(days){
  if(!days||days.length===7)return 'Diário';
  if(days.length===5&&[1,2,3,4,5].every(x=>days.includes(x)))return 'Seg–Sex';
  if(days.length===2&&days.includes(0)&&days.includes(6))return 'Fim de semana';
  if(days.length===3&&[1,3,5].every(x=>days.includes(x)))return '3×/sem';
  return days.slice().sort().map(d=>DOW[d]).join(', ');
}

// Count sessions of a finished entry from the log
function countSessions(habitId,startDate,endDate){
  let n=0;
  Object.keys(state.log).forEach(k=>{
    if(k>=startDate&&k<=endDate&&state.log[k].includes(habitId))n++;
  });
  return n;
}

let currentView='today';
const content=document.getElementById('content');

function render(){
  const dopt={weekday:'long',day:'numeric',month:'long'};
  document.getElementById('today').textContent=new Date().toLocaleDateString('pt-BR',dopt);
  const d=new Date();const k=todayKey();
  const sched=state.habits.filter(h=>isScheduled(h,d));
  const active=sched.filter(h=>!isSkipped(h.id,k));
  const skippedCt=sched.length-active.length;
  const done=active.filter(h=>isDone(h.id,k)).length;
  const pct=active.length?Math.round(done/active.length*100):0;
  const circ=207.3;
  document.getElementById('ringFill').style.strokeDashoffset=circ-(circ*pct/100);
  document.getElementById('pctNum').textContent=pct+'%';
  document.getElementById('globalStreak').textContent=globalStreak();
  gameToasts(computeGame());
  const st=document.getElementById('summaryTitle'),ss=document.getElementById('summarySub');
  if(sched.length===0){st.textContent='Comece o dia';ss.textContent='Adicione seu primeiro hábito.';}
  else if(active.length===0){st.textContent='Dia em pausa';ss.textContent='Todos os hábitos de hoje foram pulados.';}
  else if(pct===100){st.textContent='Dia completo! 🌿';ss.textContent=skippedCt?`Feitos: ${done}. Pulados: ${skippedCt}.`:'Você cumpriu todos os hábitos de hoje.';}
  else{st.textContent=done+' de '+active.length+' feitos';ss.textContent='Faltam '+(active.length-done)+' para fechar o dia'+(skippedCt?` (${skippedCt} pulado${skippedCt>1?'s':''})`:'')+'.';}

  if(currentView==='stats'){renderStats();return}
  const list=currentView==='today'?sched:state.habits;
  if(list.length===0){
    content.innerHTML='<div class="empty"><div class="em">🌱</div><p>'+
      (currentView==='today'?'Nada agendado para hoje.<br>Toque em + para criar um hábito.':'Nenhum hábito ainda.<br>Toque em + para começar.')+'</p></div>';
    return;
  }
  content.innerHTML='<div class="habits">'+list.map(h=>{
    const isD=isDone(h.id,k);
    const isS=isSkipped(h.id,k);
    const sc=isScheduled(h,d);
    const stk=habitStreak(h);
    const freqLabel=formatDays(h.days);
    const cur=h.type==='media'?state.current[h.id]:null;
    let mediaHtml='';
    if(h.type==='media'){
      if(cur){
        mediaHtml=`<div class="h-media">
          ${cur.cover?`<img class="h-media-cover" src="${esc(cur.cover)}" alt="" onerror="this.outerHTML='<div class=\\'h-media-cover empty\\'>📖</div>'">`:'<div class="h-media-cover empty">📖</div>'}
          <div class="h-media-info">
            <div class="h-media-title">${esc(cur.title)}</div>
            ${cur.author?`<div class="h-media-author">${esc(cur.author)}</div>`:''}
          </div>
        </div>`;
      }else if(currentView==='today'&&sc){
        mediaHtml='<div class="h-media-empty">Toque ✓ para começar um livro</div>';
      }
    }
    return `<div class="habit ${isD?'done':''} ${isS?'skipped':''}" style="--c:${h.color}">
      <div class="accent"></div>
      <div class="check" onclick="event.stopPropagation();tapCheck('${h.id}')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        ${h.type==='media'&&!cur&&!isD&&!isS?'<span class="check-plus">+</span>':''}
      </div>
      <div class="h-info" onclick="openActions('${h.id}')">
        <div class="icon-name"><span class="h-emoji">${esc(h.emoji)}</span><span class="h-name">${esc(h.name)}</span></div>
        <div class="h-meta">
          <span>${freqLabel}</span>
          ${h.reminder?`<span>🔔 ${esc(h.reminder)}</span>`:''}
          ${isS?'<span class="h-skip">↷ pulado hoje</span>':''}
          ${stk>0?`<span class="h-streak">🔥 ${stk} dia${stk>1?'s':''}</span>`:''}
          ${currentView==='all'&&!sc?'<span>· hoje não</span>':''}
        </div>
        ${mediaHtml}
      </div>
      <button class="h-chev" onclick="openActions('${h.id}')" aria-label="Mais ações">›</button>
    </div>`;
  }).join('')+'</div>';
}

/* ---------- GAMIFICAÇÃO (XP, níveis, conquistas) ---------- */
const LEVELS=[
  {xp:0,name:'Semente',emoji:'🌱'},
  {xp:100,name:'Broto',emoji:'🌿'},
  {xp:300,name:'Muda',emoji:'🪴'},
  {xp:700,name:'Árvore',emoji:'🌳'},
  {xp:1500,name:'Bosque',emoji:'🌲'},
  {xp:3000,name:'Floresta',emoji:'🏞️'},
];
function habitCreatedMs(h){const t=parseInt(String(h.id||'').replace(/^h/,''),10);return isNaN(t)?0:t}
function computeGame(){
  let totalDone=0;
  for(const k in state.log)totalDone+=(state.log[k]||[]).length;
  let best=0,perfect=0;
  const keys=Object.keys(state.log).concat(Object.keys(state.skipped)).filter(Boolean).sort();
  if(keys.length){
    const today=todayKey();let run=0,guard=0;
    const d=new Date(keys[0]+'T00:00');
    while(ymd(d)<=today&&guard++<2000){
      const k=ymd(d);const dayEnd=d.getTime()+86399999;
      const sched=state.habits.filter(h=>isScheduled(h,d)&&habitCreatedMs(h)<=dayEnd);
      const active=sched.filter(h=>!isSkipped(h.id,k));
      if(active.length>0){
        if(active.every(h=>isDone(h.id,k))){run++;perfect++;if(run>best)best=run}
        else if(k!==today)run=0;
      }
      d.setDate(d.getDate()+1);
    }
  }
  const books=(state.finished||[]).length;
  const xp=totalDone*10+perfect*25+books*50;
  let li=0;for(let i=0;i<LEVELS.length;i++)if(xp>=LEVELS[i].xp)li=i;
  const level=LEVELS[li],next=LEVELS[li+1]||null;
  const prog=next?(xp-level.xp)/(next.xp-level.xp):1;
  const A=[
    {id:'s3',emoji:'🔥',name:'Aquecendo',target:3,value:best,desc:'3 dias seguidos'},
    {id:'s7',emoji:'🔥',name:'Uma semana',target:7,value:best,desc:'7 dias seguidos'},
    {id:'s14',emoji:'🔥',name:'Embalado',target:14,value:best,desc:'14 dias seguidos'},
    {id:'s30',emoji:'🏆',name:'Um mês!',target:30,value:best,desc:'30 dias seguidos'},
    {id:'s100',emoji:'👑',name:'Centenário',target:100,value:best,desc:'100 dias seguidos'},
    {id:'c10',emoji:'✅',name:'Primeiros passos',target:10,value:totalDone,desc:'10 concluídos'},
    {id:'c50',emoji:'✅',name:'Constante',target:50,value:totalDone,desc:'50 concluídos'},
    {id:'c100',emoji:'💯',name:'Centena',target:100,value:totalDone,desc:'100 concluídos'},
    {id:'c365',emoji:'🌟',name:'Ano de hábitos',target:365,value:totalDone,desc:'365 concluídos'},
    {id:'p1',emoji:'🌿',name:'Dia perfeito',target:1,value:perfect,desc:'1 dia 100%'},
    {id:'p7',emoji:'🌿',name:'Semana perfeita',target:7,value:perfect,desc:'7 dias 100%'},
    {id:'p30',emoji:'🌳',name:'Impecável',target:30,value:perfect,desc:'30 dias 100%'},
    {id:'b1',emoji:'📖',name:'Primeira leitura',target:1,value:books,desc:'1 livro lido'},
    {id:'b5',emoji:'📚',name:'Leitor',target:5,value:books,desc:'5 livros lidos'},
    {id:'b10',emoji:'📚',name:'Devorador',target:10,value:books,desc:'10 livros lidos'},
  ];
  A.forEach(a=>a.unlocked=a.value>=a.target);
  return {totalDone,perfect,books,best,xp,level,next,prog,achievements:A};
}
let _prevAchIds=null,_prevLevelName=null;
function gameToasts(game){
  const nowSet=new Set(game.achievements.filter(a=>a.unlocked).map(a=>a.id));
  if(_prevAchIds===null){_prevAchIds=nowSet;_prevLevelName=game.level.name;return}
  for(const a of game.achievements)if(a.unlocked&&!_prevAchIds.has(a.id))flashSync('🏅 Conquista: '+a.name+'!');
  if(game.level.name!==_prevLevelName)flashSync(game.level.emoji+' Subiu de nível: '+game.level.name+'!');
  _prevAchIds=nowSet;_prevLevelName=game.level.name;
}

function renderStats(){
  const totalHabits=state.habits.length;
  const gs=globalStreak();
  let tot=0,comp=0;const heatData=[];
  for(let i=0;i<91;i++){
    const dt=new Date();dt.setDate(dt.getDate()-i);
    const k=ymd(dt);
    const sched=state.habits.filter(h=>isScheduled(h,dt));
    const active=sched.filter(h=>!isSkipped(h.id,k));
    const done=active.filter(h=>isDone(h.id,k)).length;
    const r=active.length?done/active.length:-1;
    heatData.unshift(r);
    if(i<30&&active.length){tot+=active.length;comp+=done}
  }
  const rate=tot?Math.round(comp/tot*100):0;
  let bestStreak=0;state.habits.forEach(h=>{const s=habitStreak(h);if(s>bestStreak)bestStreak=s});

  const heatCells=heatData.map(r=>{
    let c='var(--card2)';
    if(r>=0&&r<.34)c='rgba(124,154,90,.3)';
    else if(r>=.34&&r<.67)c='rgba(124,154,90,.6)';
    else if(r>=.67&&r<1)c='rgba(124,154,90,.8)';
    else if(r>=1)c='var(--moss)';
    return `<div class="heat-cell" style="background:${c}"></div>`;
  }).join('');

  // Day-of-week pattern (last 90d)
  const dowStats=[0,0,0,0,0,0,0].map(()=>({done:0,total:0}));
  for(let i=0;i<90;i++){
    const dt=new Date();dt.setDate(dt.getDate()-i);
    const k=ymd(dt);
    const sched=state.habits.filter(h=>isScheduled(h,dt));
    const active=sched.filter(h=>!isSkipped(h.id,k));
    if(active.length===0)continue;
    dowStats[dt.getDay()].done+=active.filter(h=>isDone(h.id,k)).length;
    dowStats[dt.getDay()].total+=active.length;
  }
  const dowPcts=dowStats.map(s=>s.total?s.done/s.total:null);
  const validIdx=dowPcts.map((p,i)=>({p,i})).filter(x=>x.p!==null);
  let maxIdx=-1,minIdx=-1;
  if(validIdx.length>=2){
    maxIdx=validIdx.reduce((a,b)=>b.p>a.p?b:a).i;
    minIdx=validIdx.reduce((a,b)=>b.p<a.p?b:a).i;
    if(maxIdx===minIdx)minIdx=-1;
  }
  const dowChart=dowPcts.map((p,i)=>{
    if(p===null)return `<div class="dow-col"><div class="dow-bar-v"></div><div class="dow-pct-v">—</div><div class="dow-label">${DOW[i]}</div></div>`;
    const h=Math.round(p*100);
    const cls=i===maxIdx?'best':i===minIdx?'worst':'';
    const color=h>=80?'var(--moss)':h>=50?'rgba(124,154,90,.75)':h>=25?'rgba(212,168,67,.75)':'rgba(200,113,74,.75)';
    return `<div class="dow-col ${cls}">
      <div class="dow-bar-v"><div class="dow-bar-fill" style="height:${Math.max(h,4)}%;background:${color}"></div></div>
      <div class="dow-pct-v">${h}%</div>
      <div class="dow-label">${DOW[i]}</div>
    </div>`;
  }).join('');
  let dowCaption='';
  if(maxIdx>=0&&minIdx>=0){
    const maxP=Math.round(dowPcts[maxIdx]*100);
    const minP=Math.round(dowPcts[minIdx]*100);
    dowCaption=`Melhor dia: <b style="color:var(--moss)">${DOW[maxIdx]}</b> (${maxP}%) · Pior: <b style="color:var(--terra)">${DOW[minIdx]}</b> (${minP}%)`;
  }else if(maxIdx>=0){
    dowCaption=`Ainda pouco dado pra comparar. Melhor até aqui: <b style="color:var(--moss)">${DOW[maxIdx]}</b>.`;
  }

  const phRows=state.habits.map(h=>{
    let t=0,c=0;
    for(let i=0;i<30;i++){
      const dt=new Date();dt.setDate(dt.getDate()-i);
      const k=ymd(dt);
      if(isScheduled(h,dt)&&!isSkipped(h.id,k)){t++;if(isDone(h.id,k))c++}
    }
    const p=t?Math.round(c/t*100):0;
    return `<div class="ph-row">
      <div class="ph-name"><span>${esc(h.emoji)}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(h.name)}</span></div>
      <div class="ph-bar"><div class="ph-fill" style="width:${p}%;background:${h.color}"></div></div>
      <div class="ph-pct">${p}%</div>
    </div>`;
  }).join('')||'<p style="color:var(--txt3);font-size:13px">Sem hábitos ainda.</p>';

  const dowCard=state.habits.length?`
    <div class="dow-card">
      <h4>Padrão semanal (90d)</h4>
      <div class="dow-chart">${dowChart}</div>
      ${dowCaption?`<div class="dow-caption">${dowCaption}</div>`:''}
    </div>`:'';

  // Library: finished items
  const finished=state.finished.slice().reverse();
  const libCard=finished.length?`
    <div class="lib-card">
      <h4>Biblioteca · lidos</h4>
      <div class="lib-grid">
        ${finished.slice(0,12).map((f,i)=>{
          const realIdx=state.finished.length-1-i;
          return `<div class="lib-item" onclick="openDetail(${realIdx})">
            ${f.cover?`<img src="${esc(f.cover)}" alt="" onerror="this.outerHTML='<div class=\\'lib-cover-empty\\'>📖</div>'">`:'<div class="lib-cover-empty">📖</div>'}
            <div class="lib-title">${esc(f.title)}</div>
          </div>`;
        }).join('')}
      </div>

function delHabit(id){
  if(!confirm('Excluir este hábito? O histórico dele será removido.'))return;
  state.habits=state.habits.filter(h=>h.id!==id);
  Object.keys(state.log).forEach(k=>{state.log[k]=state.log[k].filter(x=>x!==id)});
  Object.keys(state.skipped).forEach(k=>{state.skipped[k]=state.skipped[k].filter(x=>x!==id)});
  delete state.current[id];
  state.tombstones[id]=Date.now(); // tombstone so deletion propagates across devices
  // Note: state.finished entries for this habit are PRESERVED — library is a record of what you read, independent of habit existence
  save();render();
}

async function doSearch(query){

    const r=await fetch(url);
    if(!r.ok)throw new Error('http '+r.status);
    const data=await r.json();
    const docs=(data.docs||[]).slice(0,10);
    if(docs.length===0){statusEl.textContent='Nenhum livro encontrado. Tente outro título.';return}
    statusEl.textContent='';

    resultsEl.innerHTML=docs.map((d,i)=>{

      return `<div class="search-result" data-idx="${i}">
        ${cover?`<img class="search-cover" src="${cover}" alt="" onerror="this.outerHTML='<div class=\\'search-cover-empty\\'>📖</div>'">`:'<div class="search-cover-empty">📖</div>'}

          <div class="search-title">${esc(d.title||'')}</div>

        </div>
      </div>`;
    }).join('');
    document.querySelectorAll('.search-result').forEach(el=>{el.onclick=()=>pickBook(+el.dataset.idx)});
  }catch(e){
    statusEl.textContent='Sem conexão com a busca. Tente de novo em instantes.';
  }
}
function pickBook(idx){
  const doc=searchDocs[idx];if(!doc||!searchForHabitId)return;
  const habitId=searchForHabitId;
  const book={
    mediaId:doc.key||null,
    title:doc.title||'',

    kind:'book',

function sortKeys(v){if(Array.isArray(v))return v.map(sortKeys);if(v&&typeof v==='object'){const o={};Object.keys(v).sort().forEach(k=>o[k]=sortKeys(v[k]));return o}return v}
function sig(s){const c=JSON.parse(JSON.stringify(s||{}));delete c.updatedAt;return JSON.stringify(sortKeys(c))}
function mergeStates(a,b){
  a=a||{};b=b||{};
  const out={habits:[],log:{},skipped:{},current:{},finished:[],tombstones:{},updatedAt:0};
  const tomb={};
  [a,b].forEach(s=>{const t=s.tombstones||{};for(const id in t)tomb[id]=Math.max(tomb[id]||0,t[id])});
  const hmap={};
  [a,b].forEach(s=>(s.habits||[]).forEach(h=>{const ex=hmap[h.id];if(!ex||(h.updatedAt||0)>(ex.updatedAt||0))hmap[h.id]=h}));
  for(const id in hmap){const h=hmap[id];if((tomb[id]||0)>(h.updatedAt||0))continue;out.habits.push(h)}
  out.tombstones=tomb;
  ['log','skipped'].forEach(key=>{const m={};[a,b].forEach(s=>{const o=s[key]||{};for(const day in o){const set=new Set(m[day]||[]);(o[day]||[]).forEach(x=>set.add(x));m[day]=[...set]}});out[key]=m});
  const cmap={};
  [a,b].forEach(s=>{const c=s.current||{};for(const hid in c){const bk=c[hid];const ex=cmap[hid];if(!ex||(bk._ts||0)>(ex._ts||0))cmap[hid]=bk}});
  out.current=cmap;
  const fmap={};
  [a,b].forEach(s=>(s.finished||[]).forEach(f=>{const k=(f.habitId||'')+'|'+(f.mediaId||f.title||'')+'|'+(f.endDate||'');if(!fmap[k])fmap[k]=f}));
  out.finished=Object.values(fmap);
  for(const hid in out.current){const c=out.current[hid];
    const fin=out.finished.some(f=>f.habitId===hid&&((f.mediaId&&c.mediaId)?f.mediaId===c.mediaId:f.title===c.title)&&(!c.startDate||(f.endDate||'')>=c.startDate));
    if(fin)delete out.current[hid];}
  out.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return out;
}
async function pullMerge(){
  const {data,error}=await sb.from('vereda_data').select('data').eq('user_id',sbUser.id).maybeSingle();
  if(error)throw new Error(error.message);
  const remote=(data&&data.data)?data.data:{};
  const merged=mergeStates(state,remote);
  const changedLocal=sig(merged)!==sig(state);
  const needPush=sig(merged)!==sig(remote);
  state=merged;persist();
  return {changedLocal,needPush};
}
async function pushState(){
  const {error}=await sb.from('vereda_data').upsert({user_id:sbUser.id,data:state,updated_at:new Date().toISOString()});
  if(error)throw new Error(error.message);
}
async function syncNow(silent){
  if(!loggedIn()||syncing)return;
  syncing=true;setSyncDot('busy');
  try{
    const r=await pullMerge();
    if(r.needPush)await pushState();
    setSyncDot('ok');
    if(r.changedLocal)render();
    if(!silent)flashSync('Sincronizado.');
  }catch(e){setSyncDot('err');if(!silent)flashSync('Erro de sync: '+e.message);console.warn('sync',e)}
  finally{syncing=false}
}
function scheduleSync(){if(!loggedIn())return;setSyncDot('busy');clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(true),2000)}

function urlB64ToUint8(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const base=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base);const arr=new Uint8Array(raw.length);

}

  if(perm!=='granted')throw new Error('Permissão negada.');
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(VAPID_PUBLIC)});
  const j=sub.toJSON();
  const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'';
  const {error}=await sb.from('push_subs').upsert({user_id:sbUser.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,tz},{onConflict:'endpoint'});
  if(error)throw new Error(error.message);
  return true;
}
async function disableNotifications(){
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub){if(loggedIn())await sb.from('push_subs').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe();}
  }catch(e){}
}

/* ---------- BACKUP (export/import) ---------- */
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='vereda-backup-'+todayKey()+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  flashSync('Backup exportado.');
}
function importJSON(){
  const inp=document.getElementById('fileInput');inp.value='';
  inp.onchange=()=>{
    const file=inp.files&&inp.files[0];if(!file)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const data=JSON.parse(rd.result);
        if(!data||!Array.isArray(data.habits))throw new Error('Não parece um backup do Vereda');
        state=mergeStates(state,data);persist();scheduleSync();render();renderSettings();
        flashSync('Backup importado e mesclado.');
      }catch(e){flashSync('Falha ao importar: '+e.message)}
    };
    rd.readAsText(file);
  };
  inp.click();
}

/* ---------- SETTINGS UI ---------- */
const settingsOverlay=document.getElementById('settingsOverlay');
function openSettings(){renderSettings();settingsOverlay.classList.add('show')}
function closeSettings(){settingsOverlay.classList.remove('show')}
settingsOverlay.onclick=e=>{if(e.target===settingsOverlay)closeSettings()};
document.getElementById('settingsBtn').onclick=openSettings;
function renderSettings(){
  const box=document.getElementById('settingsSheet');
  if(loggedIn()){
    box.innerHTML=`
      <h3>Conta</h3>
      <div class="sync-status-line"><span class="sync-dot ok"></span> Conectado como <b>${esc(sbUser.email||'')}</b></div>
      <p class="help">Seus hábitos sincronizam automaticamente em qualquer aparelho onde você entrar com essa conta.</p>
      <button class="action-btn primary" id="btnSyncNow"><span class="ic">⟳</span>Sincronizar agora</button>
      <button class="action-btn" id="btnNotif"><span class="ic">🔔</span><span id="notifLbl">Ativar notificações neste aparelho</span></button>
      <button class="action-btn" id="btnExport"><span class="ic">⭳</span>Exportar backup (.json)</button>
      <button class="action-btn" id="btnImport"><span class="ic">⭱</span>Importar backup (.json)</button>
      <button class="action-btn danger" id="btnSignOut"><span class="ic">⊐</span>Sair da conta</button>
      <button class="cancel-btn" id="btnCloseSettings">Fechar</button>`;
  }else if(sbConfigured()){
    box.innerHTML=`
      <h3>Sincronizar entre aparelhos</h3>
      <p class="help">Crie uma conta (email + senha) e seus hábitos passam a acompanhar você em qualquer aparelho. Sem conta, o app funciona normalmente só neste aparelho.</p>
      <button class="save-btn" id="btnOpenAuth">Entrar ou criar conta</button>
      <hr class="sep">
      <button class="action-btn" id="btnExport"><span class="ic">⭳</span>Exportar backup (.json)</button>
      <button class="action-btn" id="btnImport"><span class="ic">⭱</span>Importar backup (.json)</button>
      <button class="cancel-btn" id="btnCloseSettings">Fechar</button>`;
  }else{
    box.innerHTML=`
      <h3>Configurar servidor</h3>
      <p class="help">Configuração única do administrador. Cole a URL e a chave pública (anon) do seu projeto Supabase. Usuários comuns não veem esta tela.</p>
      <div class="field"><label>Supabase URL</label><input type="text" id="cfgUrl" placeholder="https://xxxx.supabase.co" autocomplete="off"></div>
      <div class="field"><label>Anon key (pública)</label><input type="text" id="cfgAnon" placeholder="eyJhbGci..." autocomplete="off"></div>
      <div class="sync-status-line" id="cfgStatus"></div>
      <button class="save-btn" id="btnSaveCfg">Salvar e conectar</button>
      <hr class="sep">
      <button class="action-btn" id="btnExport"><span class="ic">⭳</span>Exportar backup (.json)</button>
      <button class="action-btn" id="btnImport"><span class="ic">⭱</span>Importar backup (.json)</button>
      <button class="cancel-btn" id="btnCloseSettings">Fechar</button>`;
  }
  const $=id=>document.getElementById(id);
  $('btnCloseSettings').onclick=closeSettings;
  if($('btnExport'))$('btnExport').onclick=exportJSON;
  if($('btnImport'))$('btnImport').onclick=importJSON;
  if($('btnSyncNow'))$('btnSyncNow').onclick=()=>syncNow(false);
  if($('btnNotif')){
    notifStatus().then(s=>{const l=$('notifLbl');if(!l)return;
      if(s==='on')l.textContent='Notificações ativas neste aparelho ✓';
      else if(s==='denied')l.textContent='Notificações bloqueadas no navegador';
      else if(s==='unsupported')l.textContent='Este navegador não suporta push';});
    $('btnNotif').onclick=async()=>{
      const s=await notifStatus();
      if(s==='on'){if(confirm('Desativar notificações neste aparelho?')){await disableNotifications();flashSync('Notificações desativadas.');renderSettings()}return}
      if(s==='unsupported'){flashSync('Este navegador não suporta notificações push.');return}
      try{await enableNotifications();flashSync('Notificações ativadas! ✓');renderSettings()}
      catch(e){flashSync('Falhou: '+e.message)}
    };
  }
  if($('btnSignOut'))$('btnSignOut').onclick=async()=>{await doSignOut();renderSettings();flashSync('Você saiu da conta.')};
  if($('btnOpenAuth'))$('btnOpenAuth').onclick=()=>{closeSettings();openAuth()};
  if($('btnSaveCfg'))$('btnSaveCfg').onclick=()=>{
    const url=$('cfgUrl').value.trim().replace(/\/+$/,'');const anon=$('cfgAnon').value.trim();
    const st=$('cfgStatus');
    if(!/^https:\/\/.+\.supabase\.co/.test(url)||anon.length<20){st.textContent='URL ou chave inválida.';return}
    localStorage.setItem('vereda_sb_url',url);localStorage.setItem('vereda_sb_anon',anon);
    st.innerHTML='<span class="sync-dot ok"></span> Salvo. Recarregando...';
    setTimeout(()=>location.reload(),700);
  };
}

/* ---------- AUTH MODAL ---------- */
let authMode='signin';
const authOverlay=document.getElementById('authOverlay');
function openAuth(){authMode='signin';renderAuth();authOverlay.classList.add('show');setTimeout(()=>document.getElementById('authEmail').focus(),300)}
function closeAuth(){authOverlay.classList.remove('show')}
authOverlay.onclick=e=>{if(e.target===authOverlay)closeAuth()};
function renderAuth(){
  document.getElementById('authTitle').textContent=authMode==='signin'?'Entrar':'Criar conta';
  document.getElementById('authPrimary').textContent=authMode==='signin'?'Entrar':'Criar conta';
  document.getElementById('authToggleLbl').textContent=authMode==='signin'?'Não tenho conta — criar':'Já tenho conta — entrar';
  document.getElementById('authStatus').textContent='';
}
document.getElementById('authToggle').onclick=()=>{authMode=authMode==='signin'?'signup':'signin';renderAuth()};
document.getElementById('authCancel').onclick=closeAuth;
document.getElementById('authGoogle').onclick=async()=>{
  const st=document.getElementById('authStatus');
  if(!initClient()){st.textContent='Servidor não configurado.';return}
  st.innerHTML='<span class="sync-spin"></span> Redirecionando para o Google...';
  try{
    const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
    if(error)throw new Error(error.message);
  }catch(e){st.textContent='Falhou: '+e.message}
};
document.getElementById('authPrimary').onclick=async()=>{
  const email=document.getElementById('authEmail').value.trim();
  const pass=document.getElementById('authPass').value;
  const st=document.getElementById('authStatus');
  if(!email||!pass){st.textContent='Preencha email e senha.';return}
  if(pass.length<6){st.textContent='A senha precisa de ao menos 6 caracteres.';return}
  if(!initClient()){st.textContent='Servidor não configurado.';return}
  st.innerHTML='<span class="sync-spin"></span> '+(authMode==='signin'?'Entrando...':'Criando conta...');
  try{
    if(authMode==='signup'){
      const r=await doSignUp(email,pass);
      if(r.needConfirm){st.textContent='Conta criada! Confirme pelo link no seu email e depois entre.';authMode='signin';return}
    }else{
      await doSignIn(email,pass);
    }
    setSyncDot('ok');closeAuth();
    await syncNow(false);
    if(settingsOverlay.classList.contains('show'))renderSettings();
  }catch(e){st.textContent='Falhou: '+e.message}
};

render();
initAuth();
window.addEventListener('online',()=>{if(loggedIn())syncNow(true)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&loggedIn())syncNow(true)});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
